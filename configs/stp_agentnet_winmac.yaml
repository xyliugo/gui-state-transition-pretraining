# Stage 1: State Transition Pretraining - AgentNet Win/Mac
# Joint inverse dynamics + forward dynamics on Windows/macOS transitions
# 320K state transitions from Win&Mac trajectories

vlm_sft:
  dataset_names:
  - agentnet_winmac_inverse
  image_transform_args:
    image_stride: 14
    max_image_size: 980
    min_image_size: 378
    max_pixels: 2_007_040
  frame_sampler_args:
    max_num_frames: 12
    min_num_frames: 8
  is_mandatory: true
  shuffle_lines: true
  shuffle_seed: 0
  num_used_data:
  - 321000
  weight: 1

forward_edit:
  dataset_names:
  - agent_winmac_forward
  image_transform_args:
    image_stride: 16
    max_image_size: 1024
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 980
    min_image_size: 378
  is_mandatory: true
  num_used_data:
  - 321000
  weight: 1
