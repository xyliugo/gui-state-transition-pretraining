# Stage 2: Trajectory Fine-Tuning - GUIOdyssey 1K subset
# Fine-tune on 1K trajectories subsampled from the 7K GUIOdyssey training set.

vlm_sft:
  dataset_names:
  - guiodyssey_agent_1k
  image_transform_args:
    image_stride: 14
    max_image_size: 980
    min_image_size: 378
    max_pixels: 2_007_040
  frame_sampler_args:
    max_num_frames: 12
    min_num_frames: 8
  is_mandatory: true
  shuffle_lines: true
  shuffle_seed: 0
  num_used_data:
  - 15259
  weight: 1
