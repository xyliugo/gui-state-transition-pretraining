# Stage 2: Trajectory Fine-Tuning - AndroidControl 3K subset
# Fine-tune on 3K trajectories subsampled from the 12K AndroidControl training set.

vlm_sft:
  dataset_names:
  - android_control_agent_3k
  image_transform_args:
    image_stride: 14
    max_image_size: 980
    min_image_size: 378
    max_pixels: 2_007_040
  frame_sampler_args:
    max_num_frames: 12
    min_num_frames: 8
  is_mandatory: true
  shuffle_lines: true
  shuffle_seed: 0
  num_used_data:
  - 16613
  weight: 1
